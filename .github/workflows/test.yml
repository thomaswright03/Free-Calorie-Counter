name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright test --project=phone-app
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 7

  # The installable app in WebKit, the engine of Safari and of Home Screen
  # apps on iPhone.
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=phone-app-webkit
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7

  # Publishes docs/ to GitHub Pages, only after both test jobs pass on a
  # push to main. It runs once Settings → Pages → Source is "GitHub
  # Actions"; while Pages still deploys from the branch it says so and
  # stops, and the branch deploy keeps the site live.
  deploy:
    needs: [test, webkit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || echo unknown)
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          if [ "$build_type" != "workflow" ]; then
            echo "::notice::Pages source is '$build_type', not GitHub Actions, so this job doesn't deploy. Set Settings → Pages → Source to GitHub Actions to deploy only after the tests pass."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.build_type == 'workflow'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.source.outputs.build_type == 'workflow'
        with:
          path: docs
      - id: deployment
        if: steps.source.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
