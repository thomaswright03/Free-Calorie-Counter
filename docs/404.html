<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-NlX5SpdD8C+KUhfx93el/g7I5L9unlmRPJpOKA2HLPE=' 'sha256-389ukorqOypGKJCOVaykY9OtvkGSzWDcNVICKVvabMk='; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070a12" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Page not found · Free Calorie Counter</title>
<link rel="icon" id="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="touch-icon" href="icons/icon-180.png">
<script>
  // The theme chosen in Free Calorie Counter's Settings, or dark until one is chosen.
  (function () {
    var pref = 'dark';
    try { pref = localStorage.getItem('fcc:theme') || 'dark'; } catch (e) { pref = 'dark'; }
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  /* The same colours as the app's light and dark themes (style.css). */
  :root {
    color-scheme: light;
    --bg: #f6f4ee;
    --card: #ffffff;
    --text: #14161f;
    --muted: #555b6e;
    --accent: #15803d;
    --accent-text: #166534;
    --on-accent: #ffffff;
    --focus: #6d28d9;
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --bg: #070a12;
    --card: #121828;
    --text: #eef2ff;
    --muted: #9aa6bf;
    --accent: #a3e635;
    --accent-text: #bef264;
    --on-accent: #0a1a03;
    --focus: #c4b5fd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 48px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  .card { max-width: 420px; margin: 0 auto; padding: 28px 20px; border-radius: 24px; background: var(--card); text-align: center; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.45); }
  .brand { margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent-text); }
  h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.02em; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    text-decoration: none;
  }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
</style>
</head>
<body>
<main class="card">
  <p class="brand">Free Calorie Counter</p>
  <h1>Page not found</h1>
  <p>There’s nothing at this address in Free Calorie Counter. Your days and photos aren’t affected.</p>
  <a class="btn" id="open-app" href="./">Open Free Calorie Counter</a>
</main>
<script>
  // This page is shown for any missing address, however deep, so the links
  // (the app and its icons) are worked out from where Free Calorie Counter lives: /<repository>/ on a GitHub Pages
  // project site (github.io), the site's root anywhere else.
  (function () {
    var first = location.pathname.split('/')[1];
    var base = /\.github\.io$/.test(location.hostname) && first ? '/' + first + '/' : '/';
    document.getElementById('open-app').setAttribute('href', base);
    document.getElementById('icon').setAttribute('href', base + 'favicon.svg');
    document.getElementById('touch-icon').setAttribute('href', base + 'icons/icon-180.png');
  })();
</script>
</body>
</html>
