<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-36soHwkOiaju+r0sZiiKNDnUOH+g+tdGMuv8F5q6rAs='; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free Calorie Counter</title>
<meta name="description" content="A private calorie and weight tracker. Your data stays on your device.">
<meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070a12" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calories">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
  // Another site may not frame the app: a transparent frame could trick
  // taps (clickjacking). GitHub Pages can't send frame-ancestors, so stop
  // loading and offer a link that opens the app on its own instead.
  if (window.top !== window.self) {
    window.stop();
    var fb = document.createElement('body');
    var fa = document.createElement('a');
    fa.href = location.href;
    fa.target = '_blank';
    fa.rel = 'noopener';
    fa.textContent = 'Open Free Calorie Counter in its own tab';
    fb.appendChild(fa);
    document.documentElement.appendChild(fb);
  }
  // Plain http: would let someone on the network alter the app, and is a
  // separate origin with its own data. Send honest visitors to https:.
  if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    location.replace('https://' + location.host + location.pathname + location.search + location.hash);
  }
  // Set the theme before the stylesheet paints, so there's no flash of the
  // wrong theme on launch. Dark until a theme is chosen in Settings.
  (function () {
    var pref = 'dark';
    try { pref = localStorage.getItem('fcc:theme') || 'dark'; } catch (e) { pref = 'dark'; }
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (bar) bar.setAttribute('content', dark ? 'black' : 'default');
  })();
</script>
<link rel="stylesheet" href="style.css">
<!-- Fetch the app script alongside the stylesheet: with the CSP meta tag
     above, Chromium no longer starts it early on its own. -->
<link rel="modulepreload" href="build/app.js">
</head>
<body>
<div class="ambient" aria-hidden="true"><span class="ambient-blob ambient-a"></span><span class="ambient-blob ambient-b"></span><span class="ambient-blob ambient-c"></span></div>

<div class="app">

  <header class="topbar">
    <div class="brand-block">
      <h1 class="brand"><img class="brand-logo" src="favicon.svg" alt="" width="36" height="36"><span class="brand-name">Free Calorie Counter</span></h1>
      <p class="tagline">Calorie &amp; weight tracker</p>
    </div>
    <nav class="tabs" aria-label="Main">
      <a class="tab" href="#/" data-tab="today"><svg class="tab-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 2.5c.8 3.6 5.5 5.8 5.5 11a5.5 5.5 0 0 1-11 0c0-2.3 1-3.9 2.2-5 .4 2 1.6 3.2 3 3.4-.8-3.2.1-6.3.3-9.4z"/></svg><span class="tab-label">Today</span></a>
      <a class="tab" href="#/history" data-tab="history"><svg class="tab-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 4.5h12a2.5 2.5 0 0 1 2.5 2.5v11a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 18V7A2.5 2.5 0 0 1 6 4.5zM3.5 9.5h17M8 2.5v4M16 2.5v4M8 13.5h2M14 13.5h2M8 17h2"/></svg><span class="tab-label">History</span></a>
      <a class="tab" href="#/compare" data-tab="compare"><svg class="tab-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 20.5v-6M12 20.5V4M19 20.5V10M2.5 20.5h19"/></svg><span class="tab-label">Compare</span></a>
      <a class="tab" href="#/photos" data-tab="photos"><svg class="tab-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4.5 7.5h3l1.8-2.5h5.4l1.8 2.5h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zM12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg><span class="tab-label">Photos</span></a>
    </nav>
    <a class="settings-link" href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
      <span>Settings</span>
    </a>
  </header>

  <div id="banners" class="banners"></div>

  <main id="main" class="main"><p class="boot-loading" role="status"><span class="spinner" aria-hidden="true"></span>Loading Free Calorie Counter…</p></main>

  <div id="loading" class="loading" role="status" hidden><span class="spinner" aria-hidden="true"></span>Loading…</div>

  <footer class="app-footer">
    <p id="storageNote" class="storage-note"></p>
  </footer>

</div>

<div id="toasts" class="toasts"></div>
<div id="announcer" class="visually-hidden" aria-live="polite"></div>

<!-- build/ holds the sources in docs/, minified into two files (npm run
     build), so a first visit on a slow connection waits for a handful of
     downloads rather than dozens. -->
<script src="build/data.js"></script>
<script type="module" src="build/app.js"></script>
</body>
</html>
