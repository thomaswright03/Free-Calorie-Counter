<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-DbA5l8XXzuXehWe6ic0nRFvZmfvMV3//6WFqZHjh08g='; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free Calorie Counter</title>
<meta name="description" content="A private calorie and weight tracker. Your data stays on your device.">
<meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calories">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>
  // Plain http: would let someone on the network alter the app, and is a
  // separate origin with its own data. Send honest visitors to https:.
  if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    location.replace('https://' + location.host + location.pathname + location.search + location.hash);
  }
  // Set the theme before the stylesheet paints, so there's no flash of the
  // wrong theme on launch. Dark until a theme is chosen in Settings.
  (function () {
    var pref = 'dark';
    try { pref = localStorage.getItem('fcc:theme') || 'dark'; } catch (e) { pref = 'dark'; }
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (bar) bar.setAttribute('content', dark ? 'black' : 'default');
  })();
</script>
<link rel="stylesheet" href="style.css">
<!-- Fetch the app script alongside the stylesheet: with the CSP meta tag
     above, Chromium no longer starts it early on its own. -->
<link rel="modulepreload" href="build/app.js">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand-block">
      <h1 class="brand">Free Calorie Counter</h1>
      <p class="tagline">Calorie &amp; weight tracker</p>
    </div>
    <nav class="tabs" aria-label="Main">
      <a class="tab" href="#/" data-tab="today">Today</a>
      <a class="tab" href="#/history" data-tab="history">History</a>
      <a class="tab" href="#/compare" data-tab="compare">Compare</a>
      <a class="tab" href="#/photos" data-tab="photos">Photos</a>
    </nav>
    <a class="settings-link" href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
      <span>Settings</span>
    </a>
  </header>

  <div id="banners" class="banners"></div>

  <main id="main" class="main"><p class="boot-loading" role="status"><span class="spinner" aria-hidden="true"></span>Loading Free Calorie Counter…</p></main>

  <div id="loading" class="loading" role="status" hidden><span class="spinner" aria-hidden="true"></span>Loading…</div>

  <footer class="app-footer">
    <p id="storageNote" class="storage-note"></p>
  </footer>

</div>

<div id="toasts" class="toasts"></div>
<div id="announcer" class="visually-hidden" aria-live="polite"></div>

<!-- build/ holds the sources in docs/, minified into two files (npm run
     build), so a first visit on a slow connection waits for a handful of
     downloads rather than dozens. -->
<script src="build/data.js"></script>
<script type="module" src="build/app.js"></script>
</body>
</html>
